<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostHelperAI - Image Standardizer</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: { 900: '#11131c', 800: '#1a1d2a', 700: '#272c3f' },
                        brand: { 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>
    <style>body { background-color: #11131c; }</style>
</head>
<body class="text-gray-200 min-h-screen flex flex-col items-center justify-center py-10 px-4 font-sans">
    
    <div class="w-full max-w-xl bg-dark-800 rounded-2xl shadow-2xl p-8 border border-dark-700">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">PostHelperAI</h1>
            <p class="text-gray-400 text-sm tracking-wide uppercase">Generador de Enlaces de Imagen</p>
        </div>

        <!-- Zona de selección de imagen -->
        <div class="mb-6">
            <label for="fileInput" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dark-700 border-dashed rounded-xl cursor-pointer hover:bg-dark-700 hover:border-brand-500 transition-all">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-gray-400 mb-3"></i>
                    <p class="text-sm text-gray-300 font-semibold">Seleccionar imagen para subir</p>
                </div>
                <input type="file" id="fileInput" class="hidden" accept="image/*">
            </label>
        </div>

        <!-- Vista Previa -->
        <div id="previewContainer" class="hidden flex flex-col items-center mb-6 bg-dark-900 p-4 rounded-xl border border-dark-700">
            <img id="previewImg" class="max-h-56 object-contain rounded" src="" alt="Vista previa">
        </div>

        <!-- Botón para subir -->
        <button id="uploadBtn" class="hidden w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3 px-4 rounded-xl transition-colors duration-200 flex justify-center items-center gap-2 mb-4">
            <i class="fa-solid fa-upload"></i> Subir a ImgBB y Obtener Link
        </button>
        
        <!-- Mensaje de carga -->
        <p id="loadingText" class="hidden text-center text-brand-500 text-sm font-semibold mb-4"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Subiendo imagen, por favor espera...</p>

        <!-- Resultado: Enlace copiable -->
        <div id="resultContainer" class="hidden">
            <label class="block text-xs text-gray-400 uppercase tracking-wide mb-2">Enlace Directo</label>
            <div class="flex gap-2">
                <input type="text" id="linkOutput" readonly class="w-full bg-dark-900 border border-dark-700 text-gray-200 text-sm rounded-lg block p-3 outline-none">
                <button id="copyBtn" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg transition-colors flex items-center justify-center" title="Copiar enlace">
                    <i class="fa-solid fa-copy"></i>
                </button>
            </div>
            <p id="copyAlert" class="text-green-400 text-xs mt-2 hidden text-center"><i class="fa-solid fa-check mr-1"></i>¡Enlace copiado al portapapeles!</p>
        </div>

    </div>

    <script>
        // === IMPORTANTE: COLOCA TU CLAVE DE IMGBB AQUÍ ===
        const IMGBB_API_KEY = "TU_API_KEY_DE_IMGBB_AQUI"; 
        // =================================================

        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImg = document.getElementById('previewImg');
        const uploadBtn = document.getElementById('uploadBtn');
        const resultContainer = document.getElementById('resultContainer');
        const linkOutput = document.getElementById('linkOutput');
        const copyBtn = document.getElementById('copyBtn');
        const loadingText = document.getElementById('loadingText');
        const copyAlert = document.getElementById('copyAlert');
        let currentFile = null;

        // Mostrar vista previa
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                currentFile = e.target.files[0];
                if (!currentFile.type.startsWith('image/')) return alert('Selecciona una imagen válida.');
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    previewImg.src = event.target.result;
                    previewContainer.classList.remove('hidden');
                    uploadBtn.classList.remove('hidden');
                    resultContainer.classList.add('hidden');
                };
                reader.readAsDataURL(currentFile);
            }
        });

        // Subir imagen a ImgBB
        uploadBtn.addEventListener('click', async () => {
            if (!currentFile) return;
            
            if (IMGBB_API_KEY === "TU_API_KEY_DE_IMGBB_AQUI") {
                alert("Por favor, agrega tu API Key de ImgBB en el código fuente para que funcione.");
                return;
            }

            // Cambiar estado visual (mostrar que está cargando)
            uploadBtn.classList.add('hidden');
            loadingText.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            const formData = new FormData();
            formData.append("image", currentFile);

            try {
                const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Mostrar enlace
                    linkOutput.value = data.data.url;
                    resultContainer.classList.remove('hidden');
                } else {
                    alert("Error al subir la imagen: " + data.error.message);
                    uploadBtn.classList.remove('hidden');
                }
            } catch (error) {
                alert("Hubo un error de conexión al subir la imagen.");
                uploadBtn.classList.remove('hidden');
            } finally {
                loadingText.classList.add('hidden');
            }
        });

        // Copiar enlace al portapapeles
        copyBtn.addEventListener('click', () => {
            linkOutput.select();
            document.execCommand('copy');
            copyAlert.classList.remove('hidden');
            setTimeout(() => {
                copyAlert.classList.add('hidden');
            }, 3000);
        });
    </script>
</body>
</html>
