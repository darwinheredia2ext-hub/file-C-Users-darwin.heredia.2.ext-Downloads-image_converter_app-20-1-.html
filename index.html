<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PostHelperAI - Image Standardizer</title>
    
    <!-- Fuentes e Íconos -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        dark: {
                            900: '#11131c', // Main bg original
                            800: '#1a1d2a', // Card bg
                            700: '#272c3f', // Hover states
                        },
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #11131c; }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex flex-col items-center justify-center py-10 px-4 font-sans">
    
    <div class="w-full max-w-xl bg-dark-800 rounded-2xl shadow-2xl p-8 border border-dark-700">
        
        <!-- Encabezado Original -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">PostHelperAI</h1>
            <p class="text-gray-400 text-sm tracking-wide uppercase">Image Standardizer</p>
        </div>

        <!-- Botón de Subida Simple (Formato Anterior) -->
        <div class="mb-6">
            <label for="fileInput" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dark-700 border-dashed rounded-xl cursor-pointer hover:bg-dark-700 hover:border-brand-500 transition-all">
                <div class="flex flex-col items-center justify-center pt-5 pb-6">
                    <i class="fa-solid fa-image text-3xl text-gray-400 mb-3"></i>
                    <p class="text-sm text-gray-300 font-semibold">Seleccionar imagen</p>
                </div>
                <input type="file" id="fileInput" class="hidden" accept="image/*">
            </label>
        </div>

        <!-- Vista Previa (Oculta por defecto) -->
        <div id="previewContainer" class="hidden flex flex-col items-center mb-6 bg-dark-900 p-4 rounded-xl border border-dark-700">
            <img id="previewImg" class="max-h-56 object-contain rounded" src="" alt="Vista previa">
        </div>

        <!-- Opciones Rápidas -->
        <div id="controlsContainer" class="hidden grid grid-cols-2 gap-4 mb-6">
            <div>
                <label class="block text-xs text-gray-400 uppercase tracking-wide mb-2">Formato</label>
                <select id="formatSelect" class="w-full bg-dark-900 border border-dark-700 text-gray-200 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block p-2.5 outline-none transition-colors">
                    <option value="image/jpeg">JPEG</option>
                    <option value="image/png">PNG</option>
                    <option value="image/webp">WebP</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-gray-400 uppercase tracking-wide mb-2">Calidad</label>
                <select id="qualitySelect" class="w-full bg-dark-900 border border-dark-700 text-gray-200 text-sm rounded-lg focus:ring-brand-500 focus:border-brand-500 block p-2.5 outline-none transition-colors">
                    <option value="1.0">Máxima (100%)</option>
                    <option value="0.8" selected>Alta (80%)</option>
                    <option value="0.6">Media (60%)</option>
                </select>
            </div>
        </div>

        <!-- Botón de Conversión -->
        <button id="convertBtn" class="hidden w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-3 px-4 rounded-xl transition-colors duration-200 flex justify-center items-center gap-2">
            <i class="fa-solid fa-download"></i> Descargar Imagen
        </button>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewImg = document.getElementById('previewImg');
        const controlsContainer = document.getElementById('controlsContainer');
        const formatSelect = document.getElementById('formatSelect');
        const qualitySelect = document.getElementById('qualitySelect');
        const convertBtn = document.getElementById('convertBtn');
        let currentFile = null;

        // Mostrar imagen seleccionada
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                const file = e.target.files[0];
                if (!file.type.startsWith('image/')) return alert('Selecciona una imagen válida.');
                
                currentFile = file;
                const reader = new FileReader();
                reader.onload = (event) => {
                    previewImg.src = event.target.result;
                    previewContainer.classList.remove('hidden');
                    controlsContainer.classList.remove('hidden');
                    convertBtn.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Convertir y descargar
        convertBtn.addEventListener('click', () => {
            if (!currentFile) return;
            const img = new Image();
            img.src = previewImg.src;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);

                const format = formatSelect.value;
                const quality = parseFloat(qualitySelect.value);
                const dataUrl = canvas.toDataURL(format, quality);
                
                const extension = format.split('/')[1] === 'jpeg' ? 'jpg' : format.split('/')[1];
                const originalName = currentFile.name.substring(0, currentFile.name.lastIndexOf('.'));
                
                const link = document.createElement('a');
                link.download = `${originalName}_standardized.${extension}`;
                link.href = dataUrl;
                link.click();
            };
        });
    </script>
</body>
</html>
